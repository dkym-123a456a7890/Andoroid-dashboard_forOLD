name: Android CI (APK Auto Build)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Set permissions for gradlew
      run: chmod +x ./gradlew

    - name: Restore debug keystore & environment
      run: |
        # 1. Restore debug.keystore from base64 if present, or generate a standard debug keystore
        if [ -f "debug.keystore.base64" ]; then
          echo "Restoring debug.keystore from debug.keystore.base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi

        # If debug.keystore still doesn't exist, generate one so Gradle signing never fails
        if [ ! -f "debug.keystore" ]; then
          echo "debug.keystore not found, generating a fresh debug keystore..."
          keytool -genkey -v -keystore debug.keystore -alias androiddebugkey -storepass android -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"
        fi

        ls -l debug.keystore

        # 2. Ensure .env exists to prevent Secrets Gradle Plugin warning/error
        if [ ! -f ".env" ]; then
          touch .env
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace -Dksp.incremental=false -Dkotlin.compiler.execution.strategy=daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload APK to GitHub Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

