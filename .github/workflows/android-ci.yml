name: Android CI (APK Auto Build)

on:
  push:
    branches:
      - main
      - master
    tags:
      - 'v*'
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '21'
        cache: 'gradle'

    - name: Set permissions for gradlew
      run: chmod +x ./gradlew

    - name: Restore debug keystore & environment
      run: |
        # 1. Restore debug.keystore from base64 if not already present
        if [ -f "debug.keystore.base64" ] && [ ! -f "debug.keystore" ]; then
          echo "Restoring debug.keystore from base64..."
          base64 -d debug.keystore.base64 > debug.keystore
        fi
        # 2. Ensure .env exists to prevent Secrets Gradle Plugin warning/error
        if [ ! -f ".env" ]; then
          touch .env
        fi

    - name: Build Debug APK
      run: ./gradlew assembleDebug --stacktrace --no-daemon

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: debug-apk
        path: app/build/outputs/apk/debug/app-debug.apk
        retention-days: 30

    - name: Upload APK to GitHub Release (on tag)
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: app/build/outputs/apk/debug/app-debug.apk
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

